name: Feature request
description: Suggest something the framework doesn't do yet
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package
      options:
        - essence
        - settings
        - billing
        - gateway-card
        - gateway-zibal
        - user-wallet
        - user-management
        - affiliates
        - announcements
        - skeleton
        - a new package
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the API you'd like to see.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API/behavior look like? Sketch it if useful.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other approaches you ruled out.
    validations:
      required: false
