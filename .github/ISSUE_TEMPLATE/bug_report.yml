name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - essence
        - settings
        - billing
        - gateway-card
        - gateway-zibal
        - user-wallet
        - user-management
        - affiliates
        - announcements
        - skeleton
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.12.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: e.g. 13.2.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.14
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal handler/config that reproduces it, if you can isolate one.
      render: php
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or stack trace
      render: shell
    validations:
      required: false
