name: release

# Reusable release workflow. Callers, on a pushed v* tag:
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: Telegram-Bot-Essentials/.github/.github/workflows/release.yml@main
#
# Creates the GitHub Release for the tag with notes generated from the merged
# PRs / commits since the previous tag. Packagist picks the tag up via each
# repo's push webhook independently.

# The `permissions:` block on the caller is required: the org default token is
# read-only and a caller cannot hand a reusable workflow more than it holds, so
# omitting it makes the run fail at startup with no job logs.

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
